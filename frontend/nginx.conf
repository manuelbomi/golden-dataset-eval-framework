server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxies the same API paths the dev server proxies in vite.config.ts,
    # so the built frontend needs no baked-in backend URL -- the backend
    # service name "backend" resolves via docker-compose's network.
    location ~ ^/(documents|tasks|golden|taxonomy|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
