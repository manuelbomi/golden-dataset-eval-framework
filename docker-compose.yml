services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: golden_dataset
      POSTGRES_USER: golden
      POSTGRES_PASSWORD: golden
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://golden:golden@db:5432/golden_dataset
      AGREEMENT_THRESHOLD: "0.6"
      MIN_ANNOTATORS_PER_TASK: "2"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
